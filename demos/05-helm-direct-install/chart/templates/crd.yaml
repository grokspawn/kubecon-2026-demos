# CRDs belong in templates/ in the helm+v2 design so they enter OLM's
# managed manifest lifecycle (applied in phases, owned, cleaned up),
# rather than Helm's crds/ directory which bypasses release rendering.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chartdemos.demo.kubecon.io
spec:
  group: demo.kubecon.io
  names:
    plural: chartdemos
    singular: chartdemo
    kind: ChartDemo
    listKind: ChartDemoList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                note:
                  type: string
