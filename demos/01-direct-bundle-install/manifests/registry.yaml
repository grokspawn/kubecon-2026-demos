# In-cluster OCI registry for demo content.
#
# The TLS certificate is issued by the olmv1-ca ClusterIssuer that the
# OLMv1 deployment creates. operator-controller mounts that CA at
# /var/ca-certs (via the operator-controller-cert secret) and passes
# --pull-cas-dir=/var/ca-certs, so images served by this registry are
# trusted for bundle pulls without any controller changes.
apiVersion: v1
kind: Namespace
metadata:
  name: kubecon-demo-registry
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubecon-demo-registry
  namespace: kubecon-demo-registry
spec:
  secretName: kubecon-demo-registry-tls
  isCA: true
  dnsNames:
    - docker-registry.kubecon-demo-registry.svc
    - docker-registry.kubecon-demo-registry.svc.cluster.local
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: olmv1-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: kubecon-demo-registry
  labels:
    app: registry
    app.kubernetes.io/name: docker-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/name: docker-registry
    spec:
      containers:
        - name: registry
          image: registry:3
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
          ports:
            - name: https
              containerPort: 5000
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: https
          volumeMounts:
            - name: certs-vol
              mountPath: /certs
      volumes:
        - name: certs-vol
          secret:
            secretName: kubecon-demo-registry-tls
---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry
  namespace: kubecon-demo-registry
spec:
  selector:
    app: registry
  ports:
    - name: https
      port: 5000
      targetPort: https
