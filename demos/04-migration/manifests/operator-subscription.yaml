apiVersion: v1
kind: Namespace
metadata:
  name: migration-demo
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: migration-demo
  namespace: migration-demo
spec: {}
---
# ecr-secret-operator ships in the operatorhubio CatalogSource that OLMv0
# installs by default and supports the AllNamespaces install mode.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ecr-secret-operator
  namespace: migration-demo
spec:
  channel: alpha
  name: ecr-secret-operator
  source: operatorhubio-catalog
  sourceNamespace: olm
