# The rollout-update beat: a deploymentConfig change through the same
# ClusterExtension. The rendered content changes, so the
# ClusterObjectDeployment cuts a new immutable revision and archives the
# previous one.
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: kubecon-rollout-operator
spec:
  namespace: kubecon-rollout-system
  source:
    sourceType: OCIImage
    ociImage:
      ref: docker-registry.kubecon-demo-registry.svc.cluster.local:5000/bundles/kubecon-rollout-operator-bundle:v0.2.0
  config:
    configType: Inline
    inline:
      deploymentConfig:
        env:
          - name: REVISION
            value: "two"
